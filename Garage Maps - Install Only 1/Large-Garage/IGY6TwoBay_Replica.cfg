# IGY6 Two-Bay — copy of the ORIGINAL garage around Bay C/D (IGY6 v1.0.9+). Ship the SAME file to all players.
#
# Every piece listed below is copied at runtime from each player's own game (nothing is extracted
# or shipped) to its original position relative to Lift A, so Lift A -> Bay C and Lift B -> Bay D.
# Game scripts are removed from the copies (no interaction); HDRP light data is kept so lights work.
# All pieces below were COPYABLE in the 2026-11-09 prop survey. Windows, main gates, most toolboxes
# and the roofing are static-batched in the game and cannot be copied (those openings stay open).
#
# The replica is about 25 x 18 m. At the current placement it would cut into the main garage.
# BEFORE enabling: move the placement (Mods\IGY6TwoBay_Placement.cfg) and press Ctrl+Shift+2 in the
# garage. The site check lists obstacles and ground height under the footprint. Candidate from
# the dump scan (unverified): anchor 26.0 / -0.15 / -2.0, yaw 90.
enabled = 0
hide_bundle = 1

