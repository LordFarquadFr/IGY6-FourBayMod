[QoLmod]
# All main settings for mod, you are free to change these.
# These turn mod features on and off. (eg . if you set everything to false, then mod does not change anything)
[QoLmod.Settings]
lastUsername = "LordFarquadFr" # Info, populated automatically
lastQoLmodversion = "4.5" # Info, populated automatically
lastGameVersion = "1.0.40" # Info, populated automatically
specialData = "" # Mostly development settings, some are found inside Readme.txt
unmarkFinishedparts = true # Jobs only, marked part will be unmarked when its good for job
markBodyParts = true # Jobs only, ability to mark job bodypart
onCustomerCarSelectLastMountedPartIfWasOk = true # Jobs only, suggested part will be previous part if not job task part
WarehousehelperIconInventory = true # Inventory will have icon showing does this part exist in warehouse
WarehousehelperIconShopList = true # Shoplist will have number showing does this part exist in warehouse
JunkyardAndBarnhelperIconShopList = true # Shoplist will have number showing does this part exist in any junkpile
removepartsfromShoppinglist = true # When you shop a part, it will be remove from your shopping list
openShoplistevenInsideshopconfig = true # Allows you check shoplist tires values inside shop. Also modify tire buy window options order
populateTirebuydataWhenusingShoplist = false # Tire and rims options will be autopopulate if shoplist where used. Above setting also needed
bypassMinigames = true # Balancer, repair, tuning, auction and alignment minigames are skipped
ALTkeyQuickSwitchUnmountMountModes = true # ALT-button will quick switch modes. Limitation, bind is not selectable
allowMountAnyBench = true # If car uses bench instead of seat, allow use any bench
allowBrakeLatheFixDrumBrake = true # You will be able to fix drum brakes also
allowMoreCameraMoving = true # Wider camera moving restrictions
allowBareFrameConfigChangeAndSpawn = true # Ability to change bare car frame to different config and junkyard might spawn bare frame
allowCarDoorOpeningOnLifter = true # Allow opening of car doors even car is on lifter
JunkyardSpawnAlwaysMaxAmountCars = false # Junkyard will have lot of cars
allowCarStrippingJunkyardAndBarn = true # Allow taking parts directly from a car
AuctionGivelargelistofCars = false # Auctions will give huge list of cars
addReloadOptionBarnAndJunkyard = false # Allow reload without going to garage between
addExitGameongaragepausemenu = true # Allow exit game directly from garage
enhancedCarEditor = true # Will give some love to CarEditor
autobackupConfigfiles = true # Everytime you save a config, they will be also saved to StreamingAssets\BackupConfigs
addBasicGameFixes = true # Some check to avoid possible load hangs and additional small game fixes
useFlycameraonPhotomode = true # Photomode uses flycamera
addFlycameraModeOnTracks = true # Flycamera added as one of cameraoption on track
addFlashlightOnGarageAndJunkyard = true # Flashligh have two brightness mode, first one aimed to PhotoMode
hideUIwhenPhotomodeHideOptions = true # This allow record clean videos without UI
enableCarLightsAndBindLbutton = true # Please note car specifig lights settings are configured inside CarEditor
turnLightsonAutomaticInsideCar = false # Lights will be turned on when you are inside a car, on tracks also
spawningCarshaveAdditionalConfigData = true # This allow spawn cars with correct bonusparts already installed
LoadLastSavegameonstartup = false # Game will go directly to garage instead of Main Menu
skipStartupVideosTotally = true # All non-necessary scenes will be skipped during game startup
hitENTERonStartup = true # Mod will try press enter during load screen, not always possible if focus is lost
setRunInBackgroundDuringSceneLoads = true # Mod will temporary alter settings that game will not stop middle of load if focus is lost
keepRunInBackgroundAlways = false # Game will not freeze when lost focus
showCameraDuringGarageLoad = true # Cinematic camera during wait time when garage extra cars are loaded
enablePausebutton = false # With keyboard 'Pause' key game logic will freeze, but you will still able to move with flycamera
showAllPartsonTrack = true # Cars will always have suspension, battery, fusebox etc on track
showVisualDamageOnTracks = true # Vehicles will display visual damage when you drive and collide
saveSortingByselections = true # Your last 'sorting order by' selection will be saved to ProfileMemory file
GarageDoorsRememberstate = true # Your garage doors state will be saved to ProfileMemory file
showPopupforGroupAddedInventory = true # When you remove wheel or suspension assembly from car, popup will show total condition
showPopupforAllPartsinGroup = true # When you remove wheel or suspension assembly from car, popup will show parts condition
showLiveriesname = true # Show liveries filename instead of just number
showCarConditiononMapscreen = true # You can see condition and license plate name of cars
DynoWindowNoblur = true # You will see car on dyno and also not get unnecessary question before
fixJobTypeWindowsAlfachannel = true # Job types will be more visible
addWrenchIconToRepairableParts = true # You will see tiny icon when you are able to repair a part
AuthenticCarNames = true # Cars renamed and branded based on file AuthenticCarNames.cfg
loadBrandlogosfromMods = true # Load additional new brand from workshop modded cars
loadTexturesFromFolder = true # Load new brands and allow replace textures
ParkingCarsLoadAll10onSceneload = true # Who needs parking anymore? But if you do
PlayerNameLicencePlatesOnShow = true # Playername appear on license plate during CarEditor thumbnail and on Showroom
aLittleRandomSteeringAngles = true # All cars will have a little bit random steering angle. Limitation, brakedisc-assembly does not rotate
moveEngineHoistNextToEngineStand = true # Engine hoist / crane will be located next to engine stand
allowPaintingNearEngineStand = false # Will replace big bodyrepair table interaction with paintbooth interaction. No-one need to know
allowWarehouseActionNearCars = false # Will replace big interactive toolbox action with warehouse action
enableGarageDecorationWithBonusparts = true # Allow decoration of garage with bonusparts. Start process clicking showcase next to ladder
enableMultipleCarsOnPhotoLocations = true # Also will load all cars when custom photolocation have 10 or more cars spots. Garage Extension Map needs this
enhancedPaintShop = true # EVERY part is paintable and with more options
enableTintingAllBodyparts = true # Tint Toolkit will allow tinting of any bodyparts with glass material
addSearchfieldOnPartSelect = true # You can search when painting and every other part select screen
SearchWithoutEnter = true # Search instant on shop screen. It is possible to find this 'extra click back' after search un-intuitive
randomEvents = true # You might encounter couple of rare event
AtGarageLoadAdditionalCarsfromParking = true # Enables extra cars outside of garage. They work little differently than garaga cars
AmountExtraCarsEnabled = 0 # How many additional showcars. Will affect garage loading time according to number. High number might affect FPS
firstExtraCarIndexNumber = 0 # Default value zero. Starting from which parking cars are loaded
disableFPScameraHeadBobbing = false # This will disable camera moving when walking around
AddDebugOptionOnPauseMenu = false # This will add powerfull debug / cheat menu inside garage pause screen
AddReloadConfigOptionOnTrackPauseMenu = false # This feature might have some limitations


